name: Release

# Push a tag like v1.0.0 and this builds, signs and publishes the APK.
#
# Signing needs four repository secrets (Settings -> Secrets and variables -> Actions):
#   KEYSTORE_BASE64   base64 of your .jks file
#   KEYSTORE_PASSWORD
#   KEY_ALIAS
#   KEY_PASSWORD
#
# Create KEYSTORE_BASE64 with:
#   macOS:  base64 -i keystore/release.jks | pbcopy
#   Linux:  base64 -w0 keystore/release.jks
#
# Without those secrets the job still succeeds but publishes a debug-signed APK, which
# existing users cannot install as an update. Keep the secrets.
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore the signing keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No keystore secret configured; the APK will be debug-signed."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 -d > keystore/release.jks
          cat > keystore.properties <<PROPS
          storeFile=keystore/release.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          PROPS
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Build release APK
        run: ./gradlew :app:assembleRelease

      - name: Fail if the APK is not properly signed
        if: steps.keystore.outputs.signed == 'true'
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          $ANDROID_HOME/build-tools/36.0.0/apksigner verify --print-certs "$APK"

      - name: Remove the keystore before anything is uploaded
        if: always()
        run: rm -rf keystore keystore.properties

      - name: Rename the APK
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [ -z "$VERSION" ] && VERSION="dev"
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/slaier-${VERSION}.apk"
          cd out && shasum -a 256 ./*.apk | tee SHA256SUMS.txt

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/*.apk
            out/SHA256SUMS.txt
          generate_release_notes: true
          draft: true
